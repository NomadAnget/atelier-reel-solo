<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频翻译</title>
<style>
  :root{
    --bg:#f5f6f9; --card:#fff; --ink:#1a1f2b; --muted:#6b7488; --line:#e7eaf0;
    --accent:#3b6ef5; --accent-ink:#fff; --ok:#1a9c6a; --err:#d84a4a;
    --track:#eef1f6; --chip:#f2f4f8; --active:#3b6ef5;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1218; --card:#161c26; --ink:#e8ecf3; --muted:#8b95a8; --line:#242c39;
    --accent:#5b84f7; --track:#1f2732; --chip:#1c232e; --active:#5b84f7;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:28px 16px}
  .wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{margin:0;font-size:19px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12.5px;margin:4px 0 0}
  label{display:block;font-size:11.5px;color:var(--muted);margin:14px 0 6px;letter-spacing:.3px}
  .row{display:flex;gap:10px}
  input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    background:transparent;color:var(--ink);font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  select{max-width:140px}
  button{padding:11px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
    font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.5;cursor:default}
  .form-actions{margin-top:16px;display:flex;justify-content:flex-end}
  /* 活动任务 */
  .active-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .active-title{font-size:14px;font-weight:600;word-break:break-all}
  .badge{font-size:11px;padding:2px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0}
  .b-run{background:var(--chip);color:var(--accent)} .b-ok{background:rgba(26,156,106,.14);color:var(--ok)}
  .b-err{background:rgba(216,74,74,.14);color:var(--err)} .b-q{background:var(--chip);color:var(--muted)}
  .bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden;margin:14px 0 6px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
  .pctline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  /* 阶段轨 */
  .stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .stage{font-size:11px;padding:4px 9px;border-radius:8px;background:var(--chip);color:var(--muted);
    display:flex;align-items:center;gap:5px;border:1px solid transparent}
  .stage.done{color:var(--ok)} .stage.done .dot{background:var(--ok)}
  .stage.active{color:var(--accent-ink);background:var(--active);border-color:var(--active)}
  .stage.active .dot{background:#fff}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--muted);flex-shrink:0}
  .result{margin-top:16px;font-size:13px}
  .result a{color:var(--accent);font-weight:600;text-decoration:none}
  .result.err{color:var(--err)}
  /* 历史 */
  .hist h2{font-size:12px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.4px}
  .job{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
  .job:first-of-type{border-top:0}
  .job .u{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .job .mini{width:70px;height:5px;background:var(--track);border-radius:99px;overflow:hidden;flex-shrink:0}
  .job .mini > i{display:block;height:100%;background:var(--accent)}
  .empty{color:var(--muted);font-size:12.5px;padding:6px 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>视频翻译</h1>
    <p class="sub">提交一个视频,选目标语言,得到本地化配音成片。单次任务工具。</p>
    <form id="f">
      <label>视频源(YouTube URL 或本地路径)</label>
      <input id="url" placeholder="https://www.youtube.com/watch?v=… 或 data/jobs/…/x.mp4" required>
      <div class="row" style="align-items:flex-end;margin-top:2px">
        <div style="flex:1">
          <label>目标语言</label>
          <select id="lang">
            <option value="zh">简体中文</option><option value="en">English</option>
            <option value="ja">日本語</option><option value="es">Español</option>
          </select>
        </div>
      </div>
      <div class="form-actions"><button id="go" type="submit">开始翻译</button></div>
    </form>
  </div>

  <div class="card" id="activeCard" style="display:none">
    <div class="active-head">
      <span class="active-title" id="aTitle">—</span>
      <span class="badge b-q" id="aBadge">—</span>
    </div>
    <div class="bar"><i id="aFill"></i></div>
    <div class="pctline"><span id="aPhase">—</span><span id="aPct">0%</span></div>
    <div class="stages" id="aStages"></div>
    <div class="result" id="aResult"></div>
  </div>

  <div class="card hist">
    <h2>最近任务</h2>
    <div id="hist"><div class="empty">暂无任务</div></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const STAGES = [
  ["采集",0,.02],["人声分离",.02,.20],["说话人轨",.20,.40],["语言识别",.40,.55],
  ["翻译",.55,.62],["配音",.62,.82],["时长对齐",.82,.84],["视频重构",.84,.89],
  ["音频合成",.89,.92],["字幕",.92,.93],["混流",.93,.95],["封面",.95,.98],
  ["元数据",.97,.98],["收尾",.98,1]
];
const LANG = {zh:"简体中文",en:"English",ja:"日本語",es:"Español"};
const ST = {queued:["排队中","b-q"],running:["处理中","b-run"],
            succeeded:["已完成","b-ok"],failed:["失败","b-err"],cancelled:["已取消","b-err"]};
let jobs = {};        // job_id → row
let activeId = null;

// ---- 提交 ----
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  $('go').disabled = true;
  const url = $('url').value.trim();
  try {
    await fetch('/api/command/web/job/requested', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({video_url:url, task_type:'video_translate', target_lang:$('lang').value})
    }).then(r=>{ if(!r.ok) throw new Error('提交失败 '+r.status); });
    // 拉取以拿到新任务(SSE 随后接管实时更新)
    for (let i=0;i<12;i++){ await refresh(); const j=Object.values(jobs).find(x=>x.video_url===url);
      if (j){ activeId=j.job_id; renderActive(); break; } await sleep(500); }
  } catch(err){ alert(err.message); }
  finally { $('go').disabled = false; }
});

// ---- 初次加载 + 刷新恢复 ----
async function refresh(){
  const rows = await q('scheduler_jobs', {order:'created_at:desc', limit:15});
  jobs = {}; rows.forEach(r=>jobs[r.job_id]=r);
  if (!activeId){ const run = rows.find(r=>r.status==='running')||rows[0]; if(run) activeId=run.job_id; }
  renderHist(); renderActive();
}
async function q(table, params){
  const r = await fetch('/api/store/'+table+'?'+new URLSearchParams(params));
  if (!r.ok) return []; return (await r.json()).rows || [];
}

// ---- 渲染 ----
function pct01(r){ let p=+r.progress||0; return p>1?p/100:p; }
function renderActive(){
  const r = activeId && jobs[activeId];
  if (!r){ $('activeCard').style.display='none'; return; }
  $('activeCard').style.display='';
  $('aTitle').textContent = shortUrl(r.video_url) + '  ·  ' + (LANG[r.target_lang]||r.target_lang||'');
  const [txt,cls] = ST[r.status]||[r.status,'b-q'];
  $('aBadge').textContent = txt; $('aBadge').className = 'badge '+cls;
  const p = r.status==='succeeded' ? 1 : pct01(r);
  $('aFill').style.width = (p*100).toFixed(0)+'%';
  $('aPct').textContent = (p*100).toFixed(0)+'%';
  $('aPhase').textContent = r.progress_message || ({queued:'排队中',succeeded:'完成',failed:'失败',cancelled:'已取消'}[r.status]||'');
  // 阶段轨
  $('aStages').innerHTML = STAGES.map(([lab,s,e],i)=>{
    let st='pending';
    if (r.status==='succeeded' || p>=e) st='done';
    else if (p>=s && p<e && r.status==='running') st='active';
    return `<span class="stage ${st}"><span class="dot"></span>S${String(i).padStart(2,'0')} ${lab}</span>`;
  }).join('');
  // 结果
  const res=$('aResult');
  if (r.status==='succeeded'){ res.className='result';
    res.innerHTML='✓ 成片已生成 —— <a href="/api/jobs/'+encodeURIComponent(r.job_id)+'/result">下载成片</a>'; }
  else if (r.status==='failed'){ res.className='result err'; res.textContent='✗ '+(r.error_msg||'失败,见日志'); }
  else res.innerHTML='';
}
function renderHist(){
  const rows = Object.values(jobs).sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  const h=$('hist');
  if (!rows.length){ h.innerHTML='<div class="empty">暂无任务</div>'; return; }
  h.innerHTML = rows.map(r=>{
    const [txt,cls]=ST[r.status]||[r.status,'b-q']; const p=(r.status==='succeeded'?1:pct01(r))*100;
    return `<div class="job" data-id="${r.job_id}">
      <span class="u">${shortUrl(r.video_url)}</span>
      <span class="mini"><i style="width:${p.toFixed(0)}%"></i></span>
      <span class="badge ${cls}">${txt}</span></div>`;
  }).join('');
  h.querySelectorAll('.job').forEach(el=>el.onclick=()=>{ activeId=el.dataset.id; renderActive(); });
}
const shortUrl = u => { u=String(u||''); const m=u.match(/[?&]v=([\w-]+)/); if(m) return 'youtube:'+m[1];
  return u.length>52 ? u.slice(0,26)+'…'+u.slice(-22) : u; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// ---- SSE 长连接:实时进度/状态(不靠轮询)----
function connectSSE(){
  const es = new EventSource('/api/stream');
  es.addEventListener('msg', ev=>{
    let d; try{ d=JSON.parse(ev.data); }catch{ return; }
    const t=d.topic, p=d.payload||{};
    if (t==='task/job/progress' && p.job_id){
      const r=jobs[p.job_id]||(jobs[p.job_id]={job_id:p.job_id});
      r.status='running'; r.progress=(p.percent>1?p.percent:p.percent*100); r.progress_message=p.message||r.progress_message;
      if(!activeId) activeId=p.job_id;
      if(p.job_id===activeId) renderActive(); renderHist();
    } else if (t==='scheduler/job/status_changed' && p.job_id){
      // 状态终态:拉一次权威行(拿 error_msg / 成片就绪)
      refresh();
    }
  });
  es.addEventListener('store', ev=>{
    let d; try{ d=JSON.parse(ev.data); }catch{ return; }
    if (d.table==='scheduler_jobs') refresh();     // 行变更 → 拉权威状态(仅变更时,非盲轮询)
  });
  es.onerror = ()=>{};   // EventSource 自动重连
}

refresh(); connectSSE();
</script>
</body>
</html>
