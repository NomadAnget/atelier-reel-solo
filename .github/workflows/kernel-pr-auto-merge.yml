name: Shared Atelier kernel validation

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  repository_dispatch:
    types: [atelier-submodule-pr]

permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: write

concurrency:
  group: atelier-kernel-${{ github.event.pull_request.number || format('{0}-{1}', github.event.client_payload.child_repo, github.event.client_payload.pr_number) || github.run_id }}
  cancel-in-progress: false

jobs:
  shared-kernel-validation:
    uses: NomadAnget/atelier-studio/.github/workflows/kernel-pr-auto-merge.yml@3b7ffca9685da6d3eee5208c7e9a272c9c7f7aa9
    with:
      coordinator-ref: 3b7ffca9685da6d3eee5208c7e9a272c9c7f7aa9
    secrets:
      ATELIER_CI_TOKEN: ${{ secrets.ATELIER_CI_TOKEN }}
      GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
